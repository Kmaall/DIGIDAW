<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#141414"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#f5f5f5" stroke-width="2"/>
  
  <g transform="translate(300, 175)">
    <!-- Dark Rose / Symbolist Geometry -->
    <circle r="65" fill="#1f1f1f" stroke="#ff3b1e" stroke-width="3"/>
    <path d="M 0 -55 C 30 -55 55 -30 55 0 C 55 30 30 55 0 55 C -30 55 -55 30 -55 0 C -55 -30 -30 -55 0 -55 Z" fill="none" stroke="#f5f5f5" stroke-width="2"/>
    <circle r="35" fill="#ff3b1e" stroke="#000" stroke-width="2"/>
    <rect x="-10" y="-10" width="20" height="20" fill="#000" transform="rotate(45)"/>
    
    <!-- Quills -->
    <line x1="-70" y1="65" x2="70" y2="-65" stroke="#ffe600" stroke-width="2"/>
  </g>
  
  <text x="300" y="325" font-family="sans-serif" font-size="20" font-weight="900" fill="#f5f5f5" text-anchor="middle" letter-spacing="3">CHARLES BAUDELAIRE</text>
  <text x="300" y="352" font-family="monospace" font-size="12" font-weight="bold" fill="#ff3b1e" text-anchor="middle" letter-spacing="2">LES FLEURS DU MAL // 1857</text>
