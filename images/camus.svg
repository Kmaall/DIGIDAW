<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#141414"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#f5f5f5" stroke-width="2"/>
  
  <g transform="translate(300, 175)">
    <!-- Mountain Incline & Rock of Sisyphus -->
    <polygon points="-120,70 120,70 60,-50" fill="#222" stroke="#f5f5f5" stroke-width="2"/>
    <circle cx="50" cy="-60" r="28" fill="#ffe600" stroke="#000" stroke-width="2"/>
    <circle cx="-50" cy="-30" r="18" fill="#ff3b1e"/>
  </g>
  
  <text x="300" y="325" font-family="sans-serif" font-size="20" font-weight="900" fill="#f5f5f5" text-anchor="middle" letter-spacing="3">ALBERT CAMUS</text>
  <text x="300" y="352" font-family="monospace" font-size="12" font-weight="bold" fill="#ffe600" text-anchor="middle" letter-spacing="2">THE MYTH OF SISYPHUS // 1942</text>
</svg>

