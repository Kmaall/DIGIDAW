<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0a0a0a"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#f5f5f5" stroke-width="2"/>

  <!-- Divine Comedy: Nine Concentric Circles (Inferno) -->
  <g transform="translate(300, 200)">
    <circle r="110" fill="none" stroke="#f5f5f5" stroke-width="1" opacity="0.3"/>
    <circle r="90" fill="none" stroke="#f5f5f5" stroke-width="1" opacity="0.4"/>
    <circle r="70" fill="none" stroke="#f5f5f5" stroke-width="1" opacity="0.5"/>
    <circle r="50" fill="none" stroke="#ffe600" stroke-width="2"/>
    <circle r="30" fill="none" stroke="#f5f5f5" stroke-width="1"/>
    <circle r="10" fill="#ffe600"/>
  </g>

  <text x="300" y="330" font-family="sans-serif" font-size="18" font-weight="900" fill="#f5f5f5" text-anchor="middle" letter-spacing="3">DANTE ALIGHIERI</text>
  <text x="300" y="355" font-family="monospace" font-size="12" font-weight="bold" fill="#ffe600" text-anchor="middle" letter-spacing="2">DIVINA COMMEDIA // C. 1320</text>
</svg>