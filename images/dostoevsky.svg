<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#141414"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#f5f5f5" stroke-width="2"/>
  
  <!-- Scales of Conscience & St. Petersburg Spires -->
  <g transform="translate(300, 175)">
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#f5f5f5" stroke-width="3"/>
    <line x1="-70" y1="-40" x2="70" y2="-40" stroke="#f5f5f5" stroke-width="3"/>
    
    <!-- Left Scale (Transgression) -->
    <line x1="-65" y1="-40" x2="-80" y2="10" stroke="#888" stroke-width="1.5"/>
    <line x1="-65" y1="-40" x2="-50" y2="10" stroke="#888" stroke-width="1.5"/>
    <path d="M -90 10 Q -65 30 -40 10 Z" fill="#ffe600" stroke="#000" stroke-width="1.5"/>
    
    <!-- Right Scale (Conscience) -->
    <line x1="65" y1="-40" x2="50" y2="25" stroke="#888" stroke-width="1.5"/>
    <line x1="65" y1="-40" x2="80" y2="25" stroke="#888" stroke-width="1.5"/>
    <path d="M 40 25 Q 65 45 90 25 Z" fill="#ff3b1e" stroke="#000" stroke-width="1.5"/>
  </g>
  
  <text x="300" y="325" font-family="sans-serif" font-size="20" font-weight="900" fill="#f5f5f5" text-anchor="middle" letter-spacing="3">FYODOR DOSTOEVSKY</text>
  <text x="300" y="352" font-family="monospace" font-size="12" font-weight="bold" fill="#ffe600" text-anchor="middle" letter-spacing="2">CRIME AND PUNISHMENT // 1866</text>
</svg>

