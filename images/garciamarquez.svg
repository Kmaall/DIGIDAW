  </g>

  <text x="300" y="330" font-family="sans-serif" font-size="20" font-weight="900" fill="#f5f5f5" text-anchor="middle" letter-spacing="3">GABRIEL GARCÍA MÁRQUEZ</text>
  <text x="300" y="355" font-family="monospace" font-size="12" font-weight="bold" fill="#ffe600" text-anchor="middle" letter-spacing="2">CIEN AÑOS DE SOLEDAD // 1967</text>
