<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0a0a0a"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#f5f5f5" stroke-width="2"/>

  <!-- Weimar Classicism: Sunburst & Laurel -->
  <g transform="translate(300, 180)">
    <circle r="50" fill="none" stroke="#ffe600" stroke-width="2"/>
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#ffe600" stroke-width="2"/>
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#ffe600" stroke-width="2"/>
    <line x1="-42" y1="-42" x2="42" y2="42" stroke="#f5f5f5" stroke-width="1" opacity="0.5"/>
    <line x1="42" y1="-42" x2="-42" y2="42" stroke="#f5f5f5" stroke-width="1" opacity="0.5"/>
    <circle cx="300" cy="180" r="10" fill="#ffe600"/>
  </g>

  <text x="300" y="330" font-family="sans-serif" font-size="18" font-weight="900" fill="#f5f5f5" text-anchor="middle" letter-spacing="3">JOHANN WOLFGANG VON GOETHE</text>
  <text x="300" y="355" font-family="monospace" font-size="12" font-weight="bold" fill="#ffe600" text-anchor="middle" letter-spacing="2">FAUST // 1808</text>
</svg>