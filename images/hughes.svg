<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0a0a0a"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#f5f5f5" stroke-width="2"/>

  <!-- Jazz Poetry: Syncopated Rhythms -->
  <g stroke="#ffe600" stroke-width="2" stroke-dasharray="6 4">
    <line x1="100" y1="120" x2="100" y2="280"/>
    <line x1="200" y1="120" x2="200" y2="280"/>
    <line x1="300" y1="120" x2="300" y2="280"/>
    <line x1="400" y1="120" x2="400" y2="280"/>
    <line x1="500" y1="120" x2="500" y2="280"/>
  </g>
  <g stroke="#f5f5f5" stroke-width="2">
    <line x1="140" y1="200" x2="140" y2="240"/>
    <line x1="240" y1="160" x2="240" y2="300"/>
    <line x1="440" y1="240" x2="440" y2="160"/>
  </g>

  <text x="300" y="330" font-family="sans-serif" font-size="18" font-weight="900" fill="#f5f5f5" text-anchor="middle" letter-spacing="3">LANGSTON HUGHES</text>
  <text x="300" y="355" font-family="monospace" font-size="12" font-weight="bold" fill="#ffe600" text-anchor="middle" letter-spacing="2">THE WEARY BLUES // 1926</text>
</svg>