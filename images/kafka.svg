<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#111111"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#f5f5f5" stroke-width="2"/>
  
  <!-- Labyrinth & Metamorphosis Beetle Silhouette -->
  <g transform="translate(300, 180)">
    <!-- Concentric Maze Boxes -->
    <rect x="-110" y="-80" width="220" height="160" fill="none" stroke="#333333" stroke-width="2"/>
    <rect x="-85" y="-60" width="170" height="120" fill="none" stroke="#555555" stroke-width="1.5"/>
    <rect x="-60" y="-40" width="120" height="80" fill="none" stroke="#888888" stroke-width="1.5"/>
    
    <!-- Stylized Beetle / Scarab -->
    <ellipse cx="0" cy="0" rx="26" ry="38" fill="#ffe600" stroke="#000" stroke-width="2"/>
    <circle cx="0" cy="-38" r="14" fill="#f5f5f5" stroke="#000" stroke-width="2"/>
    <line x1="0" y1="-38" x2="0" y2="38" stroke="#000" stroke-width="2"/>
    
    <!-- Legs -->
    <path d="M -22 -15 L -45 -30 M -26 0 L -50 0 M -22 15 L -45 30" stroke="#f5f5f5" stroke-width="2.5"/>
    <path d="M 22 -15 L 45 -30 M 26 0 L 50 0 M 22 15 L 45 30" stroke="#f5f5f5" stroke-width="2.5"/>
  </g>
  
  <text x="300" y="325" font-family="sans-serif" font-size="20" font-weight="900" fill="#f5f5f5" text-anchor="middle" letter-spacing="3">FRANZ KAFKA</text>
  <text x="300" y="352" font-family="monospace" font-size="12" font-weight="bold" fill="#ffe600" text-anchor="middle" letter-spacing="2">DIE VERWANDLUNG // 1915</text>
</svg>

