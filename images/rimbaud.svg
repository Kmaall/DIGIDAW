<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0a0a0a"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#f5f5f5" stroke-width="2"/>

  <!-- Deranged Senses: Radiating Lines (Voyant) -->
  <g transform="translate(300, 180)" stroke="#ffe600" stroke-width="1.5" opacity="0.8">
    <line x1="-100" y1="0" x2="100" y2="0"/>
    <line x1="0" y1="-100" x2="0" y2="100"/>
    <line x1="-70" y1="-70" x2="70" y2="70"/>
    <line x1="70" y1="-70" x2="-70" y2="70"/>
  </g>

  <circle cx="300" cy="180" r="40" fill="none" stroke="#ffe600" stroke-width="2"/>
  <circle cx="300" cy="180" r="10" fill="#ffe600"/>

  <text x="300" y="330" font-family="sans-serif" font-size="20" font-weight="900" fill="#f5f5f5" text-anchor="middle" letter-spacing="3">ARTHUR RIMBAUD</text>
  <text x="300" y="355" font-family="monospace" font-size="12" font-weight="bold" fill="#ffe600" text-anchor="middle" letter-spacing="2">UNE SAISON EN ENFER // 1873</text>
</svg>