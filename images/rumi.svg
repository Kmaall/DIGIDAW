<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#141414"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#f5f5f5" stroke-width="2"/>
  
  <!-- Sacred Geometric Radiant Stars -->
  <g transform="translate(300, 180)">
    <circle r="120" fill="none" stroke="#ffe600" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle r="90" fill="none" stroke="#f5f5f5" stroke-width="2"/>
    <circle r="60" fill="none" stroke="#ffe600" stroke-width="1.5"/>
    
    <!-- 8-Point Geometric Star -->
    <rect x="-45" y="-45" width="90" height="90" fill="none" stroke="#f5f5f5" stroke-width="2"/>
    <rect x="-45" y="-45" width="90" height="90" fill="none" stroke="#ffe600" stroke-width="2" transform="rotate(45)"/>
    <circle r="12" fill="#ffe600"/>
  </g>
  
  <text x="300" y="330" font-family="sans-serif" font-size="20" font-weight="900" fill="#f5f5f5" text-anchor="middle" letter-spacing="3">JALALUDDIN RUMI</text>
  <text x="300" y="355" font-family="monospace" font-size="12" font-weight="bold" fill="#ffe600" text-anchor="middle" letter-spacing="2">MASNAVI-I MA'NAVI // 1258</text>
</svg>

