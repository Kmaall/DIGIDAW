<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#181818"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#ffe600" stroke-width="2"/>
  
  <!-- Diagonal Rain Striations (Hujan Bulan Juni) -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.35">
    <line x1="80" y1="40" x2="40" y2="120"/>
    <line x1="160" y1="40" x2="120" y2="120"/>
    <line x1="240" y1="40" x2="200" y2="120"/>
    <line x1="320" y1="40" x2="280" y2="120"/>
    <line x1="400" y1="40" x2="360" y2="120"/>
    <line x1="480" y1="40" x2="440" y2="120"/>
    
    <line x1="120" y1="140" x2="80" y2="220"/>
    <line x1="200" y1="140" x2="160" y2="220"/>
    <line x1="280" y1="140" x2="240" y2="220"/>
    <line x1="360" y1="140" x2="320" y2="220"/>
    <line x1="440" y1="140" x2="400" y2="220"/>
    <line x1="520" y1="140" x2="480" y2="220"/>
  </g>
  
  <!-- Minimalist Tree & Paper Boat Silhouette -->
  <path d="M 300 120 L 300 280" stroke="#f5f5f5" stroke-width="4"/>
  <path d="M 300 170 L 250 140 M 300 190 L 350 160 M 300 230 L 240 210 M 300 240 L 360 220" stroke="#f5f5f5" stroke-width="3"/>
  
  <!-- Little boat below -->
  <polygon points="260,300 340,300 325,320 275,320" fill="#ffe600" stroke="#000" stroke-width="1.5"/>
  <polygon points="300,265 300,295 330,295" fill="#f5f5f5"/>
  
  <!-- Typography Badge -->
  <rect x="180" y="335" width="240" height="30" fill="#000000" stroke="#ffe600" stroke-width="1.5"/>
  <text x="300" y="355" font-family="monospace" font-size="12" font-weight="bold" fill="#ffe600" text-anchor="middle" letter-spacing="2">HUJAN BULAN JUNI // 1989</text>
</svg>

